<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .class{
            display: none;
        }
    </style>
</head>
<body>
    <div class="img"><img src="https://images.unsplash.com/photo-1764377723223-2353064702b1?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMnx8fGVufDB8fHx8fA%3D%3D" alt="" style="height: 100px;"></div>
    <button>show</button>
    <script>
    const image = document.querySelector(".img img");
    const btn = document.querySelector("button");
    window.addEventListener("load", () => {
        const savedState = sessionStorage.getItem("imageVisibility");
        if (savedState === "hidden") {
            image.style.display = "none";
            btn.textContent = "show";
        } else {
            image.style.display = "initial";
            btn.textContent = "hide";
        }
    });

    btn.addEventListener("click", () => {
        if (image.style.display === "none") {
            image.style.display = "initial";
            btn.textContent = "hide";
            sessionStorage.setItem("imageVisibility", "visible");
        } else {
            image.style.display = "none";
            btn.textContent = "show";
            sessionStorage.setItem("imageVisibility", "hidden");
        }
    });
</script>
</body>
</html>
