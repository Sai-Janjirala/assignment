<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border: 1px solid black;
        }
        #box-one, #box-two, #box-three {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box-one {
            background-color: red;
        }
        #box-two {
            background-color: green;
        }
        #box-three {
            background-color: blue;
        }
    </style>
</head>
<body>
    <main>
        <div id="box-one">1</div>
        <div id="box-two">2</div>
        <div id="box-three">3</div>
    </main>
</body>
</html>
