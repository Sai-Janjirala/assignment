<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Empty</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="cart-container">
        <header class="cart-header">
            <h1>Your Cart</h1>
        </header>

        <main class="cart-main">
            <div class="empty-cart-content">
                <div class="cart-icon">
                    <img src="https://png.pngtree.com/element_our/20190531/ourmid/pngtree-shopping-cart-convenient-icon-image_1287807.jpg" alt="Empty Shopping Bag">
                </div>
                <p class="empty-message">Your cart is feeling lonely</p>
                <button class="start-shopping-btn">Start Shopping</button>
            </div>
        </main>
    </div>
</body>
</html>
