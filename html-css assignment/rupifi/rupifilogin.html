<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rupifi | Retailer Login</title>
    <link rel="stylesheet" href="rupifilogin.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="illustration-container">
                <div class="illustration">
                    <img src="https://images.businessnewsdaily.com/app/uploads/2018/09/06104924/Focus-on-face-to-face-interactions.png" alt="Business Illustration" class="business-illustration">
                </div>
            </div>
        </div>

        <div class="right-section">
            <div class="login-header">
                <div class="logo">
                    <img src="https://rupifi.com/images/8-july-2021-1.png" alt="Rupifi Logo">
                </div>
                <div class="support-contact">
                    <img src="https://thumbs.dreamstime.com/b/phone-call-icon-vector-illustration-telephone-symbol-83910255.jpg" alt="Phone Icon" class="phone-icon">
                    <span>+91-8047192726</span>
                </div>
            </div>

            <div class="login-content">
                <div class="welcome-illustration">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMQXE44iI6k02-tuBg_gF8z1makqFT8fPDbQ&s" alt="Welcome Illustration">
                </div>

                <h1 class="welcome-title">Welcome to Rupifi</h1>
                <p class="welcome-subtitle">Grow your business with Rupifi credit</p>
                <p class="tagline">Buy Now, Pay Later - Easy, Affordable!</p>

                <form class="login-form">
                    <p class="form-instruction">
                        Enter your mobile number to receive One Time Password (OTP) to login
                    </p>

                    <div class="input-group">
                        <div class="country-code">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Flag_of_India.svg/1024px-Flag_of_India.svg.png" alt="India Flag" class="flag-icon">
                            <span>+91</span>
                        </div>
                        <input 
                            type="tel" 
                            class="mobile-input" 
                            placeholder="Enter Mobile Number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                        >
                    </div>

                    <button type="submit" class="btn-request-otp">Request OTP</button>
                </form>

                <div class="login-footer">
                    <p class="terms-text">
                        By continuing, you agree to Rupifi's 
                        <a href="#">Terms of Service</a> and 
                        <a href="#">Privacy Policy</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
